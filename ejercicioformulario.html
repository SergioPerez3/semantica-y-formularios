<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Contacto</title>
  </head>
  <body>
    <div class="form-title">
      <h1>Formulario de contacto</h1>
      <p>Completá el siguiente formulario para comunicarte con nosotros.</p>
    </div>

<form action="#" method="post" class="form-box">
    <legend>Datos de contacto</legend>

        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre"/>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="nombre@gmail.com"/>  
        </div>

        <div>
            <label for="mensaje">Mensaje:</label>
            <textarea name="mensaje" id="mensaje" placeholder="Escriba aqui su mensaje"></textarea>
          
        </div>

        <button type="submit">Enviar</button>
    </form>
      </div>
    </div>
  </body>
</html>
